:root{--bg:#0b1022;--ink:#ece3cf;--accent:#a99bd6;--pack:rgba(236,227,207,.05);--grain:.24;--p:0;
--serif:'WWC Serif',Georgia,serif;--hand:'WWC Hand','Comic Sans MS',cursive;--mono:'WWC Mono',monospace;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:1.2rem/1.5 var(--serif);transition:background-color 1.4s,color 1.4s;overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;opacity:var(--grain);
background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
:focus-visible{outline:2px dashed var(--accent);outline-offset:4px}

/* the backpack, pinned */
.stage{position:fixed;top:0;left:0;width:46vw;height:100vh;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
transform:translateX(var(--tx,54vw));transition:transform 1.2s cubic-bezier(.6,0,.2,1)}
.stage[data-side=l]{--tx:0vw}
.pack{width:100%;display:flex;justify-content:center}
.pack svg{height:68vh;max-width:100%;overflow:visible;transform:rotate(var(--tilt,0deg));transform-origin:50% 100%;transition:transform .6s}
.o.drag{cursor:grabbing;transition:opacity .6s}.o.back{transition:opacity .6s,transform 1s,translate .8s cubic-bezier(.3,1.8,.5,1)}
.cap{font:1.5rem/1.15 var(--hand);min-height:3.4rem;max-width:20rem;text-align:center;margin:.6rem 1rem 0;color:var(--accent)}
.meter{font:.78rem/1.5 var(--mono);opacity:.7;text-align:center;margin:0}
.ln{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fillp{fill:var(--pack)}.dash{stroke-dasharray:3 7;opacity:.45}
.hand{font:700 19px var(--hand);fill:var(--ink)}
.o{visibility:hidden;opacity:0;cursor:grab;-webkit-touch-callout:none;transform-box:fill-box;transform-origin:50% 50%;transition:opacity .6s,transform 1s}
.o:focus-visible{outline:2px dashed var(--accent)}
.bodyg{transform-origin:160px 374px;transition:transform 1s}
.s1 .bodyg{transform:scale(1.01,.99)}.s2 .bodyg{transform:scale(1.02,.975)}.s3 .bodyg{transform:scale(1.03,.96)}.s4 .bodyg{transform:scale(1.045,.945)}
.fin .bodyg{transform:none}
.t0 .bodyg{animation:thud .5s .55s}.t1 .bodyg{animation:thud2 .5s .55s}
@keyframes thud{40%{transform:translateY(7px) scale(1.06,.93)}}
@keyframes thud2{40%{transform:translateY(7px) scale(1.06,.93)}}
/* book: drops like it weighs something */
.book{transform:translateY(-190px) rotate(-14deg)}
.s1 .book{visibility:visible;opacity:1;transform:rotate(-3deg);transition-timing-function:cubic-bezier(.55,0,.9,.45)}
/* clock: ticks too fast */
.clock{transform:translateX(-150px) rotate(-70deg)}
.s2 .clock{visibility:visible;opacity:1;transform:rotate(4deg)}
.sec-h{transform-origin:140px 225px;animation:tick 12s steps(60) infinite}
.min-h{transform-origin:140px 225px;animation:tick 150s linear infinite}
.fx-clock .sec-h{animation-duration:1.2s}.fx-clock .min-h{animation-duration:8s}
@keyframes tick{to{transform:rotate(360deg)}}
/* mirror: cracks draw themselves */
.mirror{transform:translateY(70px) rotate(22deg)}
.s3 .mirror{visibility:visible;opacity:1;transform:rotate(10deg)}
.mf{fill:#9aa6c4;fill-opacity:.28;stroke:var(--ink);stroke-width:4}.sil{fill:var(--ink);opacity:.3}
.crack{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.5s ease-out}
.s3 .c1{stroke-dashoffset:0;transition-delay:.7s}.s3 .c2{stroke-dashoffset:0;transition-delay:1.6s}
.cr2 .c3,.cr3 .c3,.cr3 .c4{stroke-dashoffset:0}.cr1 .c3,.cr1 .c4,.cr2 .c4{stroke-dashoffset:1}
/* coin: lands, never settles on a side */
.coin{transform:translateY(-280px)}
.s4 .coin{visibility:visible;opacity:1;transform:none;transition-timing-function:cubic-bezier(.4,0,.8,.5)}
.flip{transform-box:fill-box;transform-origin:50% 50%}
.s4 .flip{animation:flip 3.4s 1.2s ease-in-out infinite}.fx-coin .flip{animation-duration:.8s}
@keyframes flip{25%{transform:scaleX(.05)}50%{transform:scaleX(-1)}75%{transform:scaleX(-.05)}}
.bk{fill:#4d3f7a;stroke:var(--ink);stroke-width:2}.cf{fill:#ece3cf;stroke:var(--ink);stroke-width:2.5}
.cn{fill:#cdb985;stroke:var(--ink);stroke-width:2}.rs{font:700 20px var(--mono);fill:#2b2850}
.clock .ln{stroke:var(--ink)}.clock .cf~.ln,.clock .cf~line{stroke:#161a3a}
/* finale: the pack gets lighter, the chosen thing comes out */
.fin .o{opacity:.55}

/* inside the bag */
.tag{font:700 15px var(--hand);fill:var(--accent);opacity:0;transition:opacity .3s;pointer-events:none}.o:hover .tag,.o:focus .tag{opacity:1}
.fx-clock .bell{animation:jit .09s infinite}@keyframes jit{50%{transform:translate(1.5px,-1px)}}
.t1,.t2{transition:opacity .5s}.t2{opacity:0}.open-book .t1{opacity:0}.open-book .t2{opacity:1}
.oth{opacity:0;transition:opacity .4s;fill:var(--accent);font:700 17px var(--hand)}
.mirror:hover .oth,.mirror:focus .oth{opacity:1}.mirror:hover .sil,.mirror:focus .sil{opacity:.05}
.sec{pointer-events:none}.sec>*{pointer-events:auto}
.o{-webkit-user-select:none;user-select:none}
/* sketches */
.wi{width:58px;height:58px;flex:none;overflow:visible}
.wi *{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.wi text{fill:var(--accent);stroke:none;font:700 19px var(--hand)}
.ways li{display:flex;align-items:center;gap:1rem;padding:.55rem 0;max-width:32rem}.ways li::before{display:none}
.ways li:nth-child(1) .wi{transform:rotate(-3deg)}.ways li:nth-child(2) .wi{transform:rotate(4deg)}.ways li:nth-child(3) .wi{transform:rotate(-2deg)}
.p1 .ways li{flex-direction:row-reverse;text-align:right;padding:.55rem 0}
fieldset label .wi{width:34px;height:34px;vertical-align:middle;margin:0 .6rem 0 .2rem;display:inline-block}
.pl{display:flex;align-items:center;gap:1.2rem;margin-bottom:2.5rem}.pl .wi{width:88px;height:88px}.pl .pledge{margin:0}
/* hoverable advice: the line underlines, its sketch straightens, and the object it's about glows in the bag */
.ways li{transition:transform .35s,opacity .35s}.wi{transition:transform .35s}
.ways li span{background:linear-gradient(var(--accent),var(--accent)) 0 100%/0 2px no-repeat;transition:background-size .45s}
.ways li:hover span,.ways li:focus-visible span{background-size:100% 2px}
.ways:hover li:not(:hover){opacity:.5}
.ways li:hover,.ways li:focus-visible{transform:translateX(7px)}.p1 .ways li:hover,.p1 .ways li:focus-visible{transform:translateX(-7px)}
.ways li:hover .wi,.ways li:focus-visible .wi{transform:rotate(0) scale(1.18)}
.hl-book .book,.hl-clock .clock,.hl-mirror .mirror,.hl-coin .coin{filter:drop-shadow(0 0 7px var(--accent))}
fieldset label:hover{font-style:italic}
@media(max-width:820px){.ways li:hover,.p1 .ways li:hover{transform:none}}
/* finale: the chosen object rises through the opening, tips over the top and floats free above the bag */
.book{--r:-3deg;--mx:0px;--my:-203px;--dx:0px;--dy:-310px}
.clock{--r:4deg;--mx:0px;--my:-130px;--dx:20px;--dy:-237px}
.mirror{--r:10deg;--mx:0px;--my:-73px;--dx:-38px;--dy:-180px}
.coin{--r:0deg;--mx:0px;--my:-159px;--dx:-48px;--dy:-266px}
.fin.pick-book .book,.fin.pick-clock .clock,.fin.pick-mirror .mirror,.fin.pick-coin .coin{opacity:1;transform:translate(var(--dx),var(--dy)) scale(.85);
 animation:out 2.6s cubic-bezier(.4,0,.2,1) forwards,sway 4.5s 2.6s ease-in-out infinite}
@keyframes out{0%{transform:translate(0,0) rotate(var(--r))}
 38%{transform:translate(var(--mx),var(--my)) rotate(calc(var(--r)*.4))}
 72%{transform:translate(var(--dx),calc(var(--dy) - 16px)) rotate(0deg) scale(.9)}
 100%{transform:translate(var(--dx),var(--dy)) rotate(0deg) scale(.85)}}
@keyframes sway{50%{rotate:3deg}}
.fin[class*=" pick-"] .bodyg{animation:relief 1s 1.3s}
@keyframes relief{40%{transform:translateY(-7px) scale(.97,1.03)}}
.pack{transition:transform 1s}.pack.fin{transform:translateY(4vh)}
.cap,.meter{transition:transform 1s}.pack.fin~.cap,.pack.fin~.meter{transform:translateY(4vh)}
@media(max-width:820px){.pack.fin{transform:translateY(2.5vh)}.pack.fin~.cap,.pack.fin~.meter{transform:translateY(2.5vh)}}
/* ending + focus */
.shared{max-width:34rem;margin-bottom:5rem}.fin-sec .shared h2{font-size:clamp(2.4rem,5vw,4.6rem);margin-bottom:1.6rem;line-height:.95}
.shared .lead{font-size:1.6rem;font-style:italic;line-height:1.3}.shared p{margin:0 0 1.1rem}
.pick{font:400 clamp(2rem,4vw,3rem)/1 var(--serif);letter-spacing:-.02em;margin:0 0 1.6rem}
.pack{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.o:focus-visible{outline:2px dashed var(--accent);filter:drop-shadow(0 0 4px var(--accent))}
/* site nav */
.nav{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:1.7rem;padding:calc(.8rem + env(safe-area-inset-top,0px)) 3vw .8rem;background:var(--bg);border-bottom:1px dashed var(--accent);transition:background-color 1.4s}
.nav button{all:unset;cursor:pointer;font:1.05rem var(--serif);opacity:.6;border-bottom:2px solid transparent;padding:.1rem 0}
.nav button[aria-current=true]{opacity:1;border-color:var(--accent)}
.nav button:hover{opacity:1}.nav button:focus-visible{outline:2px dashed var(--accent);outline-offset:4px}
.nav .mark{font:italic 1.4rem var(--serif);margin-right:auto;opacity:1}
.bar{position:absolute;left:0;bottom:-1px;height:2px;background:var(--accent);width:calc(var(--p)*100%)}
/* the words */
.sec{position:relative;z-index:2;min-height:112vh;padding:16vh 6vw 14vh}
.txt{width:min(38rem,44vw)}
.s-l .txt{margin-right:auto}.s-r .txt{margin-left:auto}
h1,h2{font-weight:400;margin:0;line-height:.88;letter-spacing:calc(-.055em + var(--p)*.05em)}
h1{font-size:clamp(3.4rem,10.5vw,9.5rem);position:relative;z-index:3}
h1 .b{display:block;font-style:italic;margin-left:9vw;transform:rotate(-2deg);transform-origin:left;text-decoration:underline wavy var(--accent) 3px;text-underline-offset:.12em}
h2{font-size:clamp(2.8rem,6.5vw,6rem);margin:0 0 1.8rem}
.intro .lede{max-width:24rem;margin:3rem 0 0 2vw;font-size:1.3rem}
.scroll{font:1.6rem var(--hand);color:var(--accent);margin:2rem 0 0 2vw}
blockquote{margin:0 0 1.6rem;padding-left:1.1rem;border-left:2px solid var(--accent);font-size:1.55rem;line-height:1.3;font-style:italic;transform:rotate(-.5deg)}
.what{margin:0 0 2rem;max-width:30rem}
.ways{list-style:none;padding:0;margin:0;font:1.55rem/1.15 var(--hand)}
.ways li{padding:.45rem 0 .45rem 1.6rem;position:relative;max-width:30rem}
.ways li::before{content:"–";position:absolute;left:0;color:var(--accent)}
.ways li:nth-child(2){margin-left:1.4rem;transform:rotate(.6deg)}.ways li:nth-child(3){margin-left:.4rem;transform:rotate(-.5deg)}
.p0{padding-top:20vh}.p0 h2{margin-bottom:1rem}.p0 .what{font-size:1.1rem;line-height:1.35}
.p1 .txt{text-align:right}.p1 blockquote{border-left:0;border-right:2px solid var(--accent);padding:0 1.1rem 0 0;transform:rotate(.7deg)}
.p1 .ways li{margin-left:auto;padding:.45rem 1.6rem .45rem 0}.p1 .ways li::before{left:auto;right:0}
.p2{padding-top:22vh}.p2 h2{margin-left:-1.5vw;font-size:clamp(2.6rem,6vw,5.4rem)}.p2 .ways li{max-width:24rem}
.p3 .ways{border-top:1px dashed var(--accent);padding-top:1rem;margin-top:2.5rem}.p3 h2{letter-spacing:calc(-.05em + var(--p)*.07em)}
.fin-sec{padding-bottom:10vh;min-height:130vh}
.fin-sec h2{font-size:clamp(3rem,7vw,6.5rem)}
fieldset{border:0;margin:0 0 2rem;padding:0}
legend{font:1.5rem var(--hand);color:var(--accent);padding:0;margin-bottom:.4rem}
fieldset label{display:block;font-size:1.5rem;line-height:1.25;padding:.35rem 0;cursor:pointer;position:relative;padding-left:1.5rem}
fieldset input{position:absolute;opacity:0}
fieldset label::before{content:"○";position:absolute;left:0;color:var(--accent)}
fieldset label.on{font-style:italic;text-decoration:underline wavy var(--accent) 1.5px;text-underline-offset:.2em}fieldset label.on::before{content:"●"}
fieldset label:focus-within{outline:2px dashed var(--accent);outline-offset:3px}
.pledge{font:700 1.9rem/1.15 var(--hand);color:var(--accent);margin:0 0 2.5rem;max-width:30rem;transform:rotate(-.8deg)}
.close{max-width:30rem;font-size:1.5rem;line-height:1.3}
.close small{display:block;margin-top:2rem;font:.82rem/1.5 var(--mono);opacity:.75}

@media(max-width:820px){
body{font-size:1.1rem}
.stage{width:100%;height:36vh;height:36svh;transform:none!important;background:var(--bg);z-index:5;border-bottom:1px dashed var(--accent);justify-content:flex-start;padding-top:calc(.6rem + env(safe-area-inset-top,0px));transition:background-color 1.4s}
.pack svg{height:22vh;height:22svh}
.cap{font-size:1.2rem;min-height:2.4rem;margin-top:.2rem}.meter{font-size:.68rem}
.sec{padding:calc(36vh + 2rem) 1.3rem 5rem;min-height:100vh}
.txt{width:100%}.p1 .txt{text-align:left}
.p1 blockquote{border-right:0;border-left:2px solid var(--accent);padding:0 0 0 1.1rem}
.p1 .ways li{margin-left:0;padding:.45rem 0 .45rem 1.6rem}.p1 .ways li::before{left:0;right:auto}
h1{font-size:clamp(3rem,17vw,5rem)}h1 .b{margin-left:5vw}
}
@media(max-width:820px){
.nav{top:auto;bottom:0;gap:.9rem;justify-content:space-between;padding:.7rem 1rem calc(.7rem + env(safe-area-inset-bottom,0px));border-bottom:0;border-top:1px dashed var(--accent);overflow-x:auto}
.nav button{font-size:.82rem;white-space:nowrap}.nav .mark{display:none}.bar{bottom:auto;top:-1px}
.sec{padding-bottom:9rem}.fin-sec{padding-bottom:9rem}}
@media(max-width:820px){.p1 .ways li{flex-direction:row;text-align:left;padding:.55rem 0;margin-left:0}.wi{width:40px;height:40px}.ways{font-size:1.3rem}.ways li{gap:.7rem}fieldset label{font-size:1.3rem}.pl .wi{width:64px;height:64px}.shared .lead{font-size:1.35rem}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.pack svg{transform:none!important}*{animation:none!important;transition-duration:.01s!important}}
</style>
